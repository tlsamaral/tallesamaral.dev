<!doctype html>
<!-- Postie portfolio cover (1600x1200). Open with ?l=en or ?l=pt and screenshot at 1600x1200. -->
<html lang="en"><head><meta charset="UTF-8"/>
<style>
@font-face { font-family:"Fredoka"; src:url("fonts/fredoka-latin-wght-normal.woff2") format("woff2"); font-weight:300 700; }
@font-face { font-family:"Figtree"; src:url("fonts/figtree-latin-wght-normal.woff2") format("woff2"); font-weight:300 900; }
:root { --acc:#E8442A; --deep:#B3321C; --tint:#FFEDE8; --tint2:#FFF8F6; --hl:#FFCFC4; --blue:#3B5BFF; --ink:#1F2D35; --ink2:#5A6A72; --gray:#F3F6F7; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1600px; height:1200px; overflow:hidden; background:#fff; }
.slide { position:absolute; inset:0; background:#fff; overflow:hidden; font-family:"Figtree",sans-serif; color:var(--ink); }
.brand { position:absolute; left:110px; top:96px; display:flex; align-items:center; gap:16px; font-family:"Fredoka",sans-serif; font-weight:600; font-size:40px; }
.eyebrow { position:absolute; left:110px; top:300px; font-size:26px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--deep); }
.h1 { position:absolute; left:110px; top:352px; width:760px; font-family:"Fredoka",sans-serif; font-weight:600; font-size:100px; line-height:1; letter-spacing:-.01em; }
.h1 .l { display:block; }
.hl { background:linear-gradient(transparent 60%, var(--hl) 60%, var(--hl) 92%, transparent 92%); padding:0 8px; margin:0 -8px; }
.sub { position:absolute; left:110px; top:700px; width:620px; font-size:34px; line-height:1.38; color:var(--ink2); font-weight:500; }
.chips { position:absolute; left:110px; bottom:110px; display:flex; gap:12px; }
.chip { display:inline-flex; align-items:center; height:52px; padding:0 20px; border-radius:26px; background:var(--gray); font-size:22px; white-space:nowrap; font-weight:700; }
.chip.c { background:var(--tint); color:var(--deep); }
.fl { position:absolute; background:#fff; border-radius:32px; box-shadow:0 22px 54px rgba(31,45,53,.11); }
.fl small { display:block; font-size:18px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2); margin-bottom:8px; }
.bub { padding:22px 30px 24px; font-size:31px; font-weight:600; line-height:1.25; }
.bub.ac { background:var(--acc); color:#fff; }
.bub.ac small { color:#FFD9D0; }
.pill { display:inline-flex; align-items:center; height:42px; padding:0 16px; border-radius:21px; font-size:21px; font-weight:800; }
</style></head><body>
<div id="s" class="slide"></div>
<script>
function stripes(x,y,w,h,r,sw){
  const per=2*(w+h-4*r)+2*Math.PI*r;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="#fff"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="none" stroke="#E8442A" stroke-width="${sw}" stroke-dasharray="26 26"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="none" stroke="#3B5BFF" stroke-width="${sw}" stroke-dasharray="26 26" stroke-dashoffset="-26"/>`;
}
function envelope(){
  const W=470,H=330;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="overflow:visible;filter:drop-shadow(0 24px 40px rgba(31,45,53,.18))">
    ${stripes(8,8,W-16,H-16,26,14)}
    <rect x="22" y="22" width="${W-44}" height="${H-44}" rx="16" fill="#fff"/>
    <path d="M30 40 L${W/2} 190 L${W-30} 40" fill="none" stroke="#E6E9F2" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M30 ${H-40} L168 150 M${W-30} ${H-40} L${W-168} 150" fill="none" stroke="#E6E9F2" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(${W-136},44)"><rect width="84" height="100" rx="10" fill="#E8442A"/><rect x="8" y="8" width="68" height="84" rx="6" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="7 6"/><text x="42" y="68" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="52" fill="#fff">P</text></g>
  </svg>`;
}
function mark(){return `<svg viewBox="0 0 64 56" width="64" height="56"><rect x="3" y="6" width="58" height="44" rx="9" fill="#fff" stroke="#E8442A" stroke-width="6"/><path d="M8 14 L32 33 L56 14" fill="none" stroke="#3B5BFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="54" cy="10" r="9" fill="#E8442A" stroke="#fff" stroke-width="4"/></svg>`}
function ripples(){return [300,400,500].map((r,i)=>`<ellipse cx="0" cy="0" rx="${r}" ry="${r*.66}" fill="none" stroke="#E8442A" stroke-width="5" stroke-opacity="${[.22,.13,.07][i]}"/>`).join('')}
const T={
 en:{lang:'en',eyebrow:'Autonomous ticket triage',h:['From chaotic','email to the','<span class="hl">right issue</span>'],sub:'An open-source agent that reads, understands, routes and deduplicates support email into GitHub Issues.',
  chips:[['Open source',1],['Gemini + GPT-4o',0],['Hexagonal',0],['Docker',0]],tag:'Open source · TypeScript',
  mail:'New email',mailTxt:"Checkout won't load",att:'+ screenshot',tri:'Triage',bug:'Bug',high:'HIGH',scope:'web-app',
  dup:'Deduplication',dupTxt:'Same root cause as #128: comment and escalate.',prio:'3 reports',sample:'Sample data'},
 pt:{lang:'pt',eyebrow:'Triagem autônoma de chamados',h:['Do e-mail','caótico à','<span class="hl">issue certa</span>'],sub:'Um agente open source que lê, entende, roteia e deduplica chamados por e-mail em issues do GitHub.',
  chips:[['Open source',1],['Gemini + GPT-4o',0],['Hexagonal',0],['Docker',0]],tag:'Open source · TypeScript',
  mail:'Novo e-mail',mailTxt:'Checkout não carrega',att:'+ print de tela',tri:'Triagem',bug:'Bug',high:'HIGH',scope:'web-app',
  dup:'Deduplicação',dupTxt:'Mesma causa-raiz da #128: comenta e escala.',prio:'3 relatos',sample:'Dados de exemplo'}
};
function build(t){
  document.documentElement.lang=t.lang;
  const seg=['LOW','MED','HIGH','CRIT'].map((n,i)=>`<div style="flex:1;height:18px;border-radius:9px;background:${i<3?['#E6E9F2','#FFD9A8','#E8442A'][i]:'#E6E9F2'}"></div>`).join('');
  document.getElementById('s').innerHTML=`
  <div style="position:absolute;left:0;top:0;right:0;height:14px;background:repeating-linear-gradient(135deg,#E8442A 0 28px,#fff 28px 42px,#3B5BFF 42px 70px,#fff 70px 84px)"></div>
  <div style="position:absolute;left:640px;top:40px;width:1120px;height:1120px;border-radius:50%;background:var(--tint2)"></div>
  <div style="position:absolute;left:800px;top:200px;width:800px;height:800px;border-radius:50%;background:var(--tint)"></div>
  <div class="brand"><span style="width:64px;height:56px;display:block">${mark()}</span>Postie</div>
  <div style="position:absolute;right:110px;top:112px;font-size:26px;font-weight:700;color:var(--ink2)">${t.tag}</div>
  <div class="eyebrow">${t.eyebrow}</div>
  <div class="h1">${t.h.map(l=>`<span class="l">${l}</span>`).join('')}</div>
  <div class="sub">${t.sub}</div>
  <div class="chips">${t.chips.map(([c,on])=>`<span class="chip ${on?'c':''}">${c}</span>`).join('')}</div>
  <svg style="position:absolute;left:1180px;top:560px;overflow:visible" width="2" height="2" viewBox="0 0 2 2">${ripples()}</svg>
  <div style="position:absolute;left:945px;top:395px">${envelope()}</div>
  <div class="fl bub" style="left:820px;top:236px;font-size:29px"><small>${t.mail}</small>${t.mailTxt}<div style="margin-top:6px;font-size:22px;font-weight:700;color:var(--ink2)">${t.att}</div></div>
  <div class="fl" style="right:96px;top:226px;width:290px;padding:22px 24px 24px"><small>${t.tri}</small>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px">
      <span class="pill" style="background:#FFE3DE;color:#B3321C">${t.bug}</span>
      <span class="pill" style="background:#FFE9C7;color:#9A5B00">${t.high}</span>
      <span class="pill" style="background:#E3E8FF;color:#2A3FC9">${t.scope}</span></div></div>
  <div class="fl bub ac" style="right:96px;top:742px;width:480px"><small>${t.dup}</small>${t.dupTxt}</div>
  <div class="fl" style="left:860px;top:922px;padding:22px 30px 22px;width:340px"><small>${t.prio}</small><div style="display:flex;gap:8px;margin-top:10px">${seg}</div></div>
  <div class="fl" style="right:96px;top:972px;padding:16px 26px;display:flex;align-items:center;gap:14px"><span style="width:14px;height:14px;border-radius:7px;background:#E8442A"></span><span style="font-size:22px;font-weight:700;color:var(--ink2)">${t.sample}</span></div>`;
}
build(T[new URLSearchParams(location.search).get('l')||'en']);
</script></body></html>
